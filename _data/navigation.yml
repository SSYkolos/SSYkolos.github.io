# Main menu. An item only shows when its target exists:
#   collection: <name>  -> shown when that collection has at least one file
#   anchor: true        -> always shown (links to a section of a page)
#   otherwise           -> shown when a published page has this url
- title: Products
  url: /products/
  collection: products
- title: Tools
  url: /tools/
  collection: landing
- title: Pricing
  url: /pricing/
- title: Projects
  url: /projects/
- title: Research
  url: /research/
- title: Founder
  url: /about/
- title: Contact
  url: /#contact
  anchor: true

      text: "Materials, thicknesses, sheet size, fees and minimum order value. If you calculate differently, we write it for you."
    - title: We tune it on your past jobs
      text: "We compare the calculation with the drawings and prices of 10–15 past jobs. Until then the price is only an estimate, so we check this together before going live."
    - title: We fit and install it
      text: "We match the look to your site and install it. If your site cannot take the code, the calculator also works at its own address, behind a button."
  figures:
    - value: "0.24 s"
      label: "to fully price a sample bracket on the live system, measured November 2026"

  skip: Ugrás a tartalomra
  crumb: Termékek
  kind: Honlapba épülő kalkulátor
  title_html: Azonnali ár a honlapján.<br><em>A végső szó az Öné.</em>
  lede: "Árkalkulátor lézervágó műhelyeknek. A vevő feltölti a DXF- vagy DWG-rajzát, és azonnal tájékoztató árat lát, az Önök áraival számolva. Önök megkapják a rajzot és a kalkulációt, majd jóváhagyják vagy átírják az árat."
  cta: Kérek bemutatót
  cta_subject: Lézervágási árkalkulátor bemutató
  cta_how: Így működik
  note: "Új termék, az első műhelyekkel közösen állítjuk be. Az éles próba 2 hónapig ingyenes, kötelezettség nélkül."
  sample: Minta, kitalált árakkal

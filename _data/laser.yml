      title: Ellenőrzést kérő rajz
      text: "Például DWG-ből átalakított rajz, vagy a műhely által megadott darabszám vagy végösszeg fölötti rendelés. A vevő látja az árat, de jelezzük neki, hogy az üzem külön ellenőrzi."
    - tag: Egyedi ajánlat
      class: stop
      title: Amit nem áraz automatikusan
      text: "Hajlítási vonal, nyitott kontúr, a táblánál nagyobb alkatrész, PDF vagy STEP, és a gravírozás, ha a műhely nem adott meg rá díjat. Ár nélkül, a rajzzal együtt érkezik Önökhöz."
  setup_kicker: Bevezetés
  setup_title: Az Önök áraival, az Önök honlapján
  setup:
    - title: Felvesszük az árait
      text: "Anyagok, vastagságok, táblaméret, díjak és minimum rendelési érték. Ha más a számításuk, megírjuk hozzá."
    - title: Hangoljuk a korábbi munkáin
      text: "10–15 korábbi munka rajzát és árát összevetjük a számítással. Addig a kapott ár csak becslés, ezért élesítés előtt ezt együtt ellenőrizzük."
    - title: Illesztjük és beépítjük
      text: "A megjelenést a honlapjához igazítjuk, és beépítjük. Ha a honlapjába nem tehető ilyen kód, a kalkulátor saját címén, egy gombról is elérhető."
  figures:
    - value: "0,24 s"
      label: "egy minta konzol teljes árazása az élő rendszeren, 2026. novemberi mérés"
    - value: "0,02 mm"
      label: vágáshossz-pontosság 14 referenciarajzon
    - value: "20"
      label: rajz egy ajánlatkérésben, rajzonként legfeljebb 5 MB
    - value: "30 nap"
      label: ingyenes éles próba, kötelezettség nélkül
  faq_kicker: Kérdések
  faq_title: Amit a műhelyek először kérdeznek
  faq:
    - q: A versenytársaink is láthatják az áraimat?
      a: "Igen, ahogy ma is megtudhatják, ha rajzot küldenek ajánlatkérésre. A kalkulátorral ez gyorsabb, cserébe az a vevő is azonnal árat kap Önöktől, aki estig nem várna. A végleges árról továbbra is Önök döntenek."
    - q: Mi történik a hajlított alkatrészekkel?
      a: "A hajlítást a kalkulátor nem árazza. Ha a hajlítási vonal külön rétegen van vagy nyitott vonalként látszik, a rajz egyedi ajánlatkérésként érkezik. Más módon rajzolt hajlítást nem ismer fel, ezért fontos, hogy a vevőt semmi nem köti az Önök jóváhagyásáig."
    - q: Hová kerülnek a rajzok?
      a: "A rendszer csak az ár kiszámításához használja a rajzot, és nem tárolja. Ajánlatkéréskor e-mailben, mellékletként továbbítja Önöknek."
    - q: Mennyire pontos az ár?
      a: "A geometriát 14 referenciarajzon ellenőriztük, az ár viszont csak akkor megbízható, ha az Önök munkáira hangoltuk. Ezért tájékoztató ár, amelyet Önök hagynak jóvá."
    - q: Mi van, ha a vevőnek nincs DXF-e?
      a: "Elküldheti a PDF-et, a STEP-et vagy a fotót is. Ehhez nem kap azonnali árat, Önök pedig ugyanúgy megkapják a kérést a fájllal együtt."
  close_title: Megnézné a saját áraival?
  close_text: "Írjon nekünk, és beállítunk egy próbaoldalt a műhelye anyagaival és áraival."
  privacy: Adatkezelés
  foot_note: Ez az oldal nem használ sütit és követést.

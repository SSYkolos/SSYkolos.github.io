  offer_a:
    - [Több rajz egyszerre, "Egy ajánlatkérésben legfeljebb 20 alkatrész, rajzonként 5 MB-ig."]
    - [Alkatrészenként külön, "Minden rajznak saját előnézete, anyaga, vastagsága, darabszáma és ára van, és egyenként végiglapozható."]
    - [Gravírozás, "A gravírozási rétegeket a vágástól külön méri és árazza, az elő- és a hátoldalt is megkülönbözteti."]
    - [Sorjázás, "Ha a műhely kínálja, egy jelölőnégyzettel kérhető, és a vágáshossz alapján kerül az árba."]
    - [Darabár mennyiség szerint, "Rögtön látja, mennyit változik a darabár nagyobb mennyiségnél."]
    - [Tételes ár, "Anyag, vágás, beszúrás, apró részletek, nettó, áfa és bruttó, valamint a gyártási idő, ha a műhely megadja."]
    - [Többféle rajz, "DXF és DWG azonnali árral. PDF, STEP, IGES vagy fotó esetén kézi ajánlatot kér."]
    - [Visszaigazolás, "Azonosítóval ellátott levelet kap, majd e-mailben a végleges árat. Magyarul és angolul is használható."]
  offer_b:
    - [Saját kezelőfelület, "Az árait a műhely később maga is módosíthatja egy külön adminisztrációs oldalon."]
    - [Saját megjelenés, "A kalkulátor a műhely nevével, logójával, színeivel, betűtípusával és formáival jelenik meg."]
    - [Kész ajánlatkérés, "A rajz mellékletben, a vevő adataival és a teljes kalkulációval, több alkatrésznél alkatrészenként is."]
    - [Jóváhagyás vagy átírás, "A nettó ár a levélből megnyitott oldalon módosítható, megjegyzés is írható a vevőnek."]
    - [Kézi ellenőrzés küszöbbel, "Megadhatja, mekkora darabszám vagy végösszeg fölött kerüljön minden ár kézi ellenőrzésre."]
    - [Rétegek kizárása, "A keret, a méretvonal és más, nem vágandó réteg kizárható az árazásból."]
    - [Beállítást vállalunk, "Az árak felvételét, a hangolást, az illesztést és a beépítést elvégezzük, a szolgáltatást mi üzemeltetjük."]

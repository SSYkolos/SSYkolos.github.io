  how_title: A rajztól a végleges árig
  how_note: "A képek a valódi rendszer minta-eredményét mutatják, kitalált árakkal és kitalált vevővel."
  steps:
    - title: A vevő feltölt, és azonnal árat lát
      text: "Nem kell regisztrálnia, és nem kell válaszra várnia. Látja a rajz előnézetét, a vágáshosszt, a beszúrásokat és a tételes számítást. Egyszerre 20 rajzot is feltölthet."
    - title: Önökhöz rendezett ajánlatkérés érkezik
      text: "Egy levélben megkapják a rajzot, a vevő adatait, az anyagot, a vastagságot, a darabszámot és a kalkulációt. Az alapadatokat nem kell visszakérdezniük."
    - title: Önök döntenek az árról
      text: "A levél gombja megnyitja a jóváhagyó oldalt, rajta a kiszámolt nettó árral. Jóváhagyják vagy átírják, és a vevő e-mailben megkapja a végleges árat. Addig az ár senkit nem köt."

      label: free live trial, no obligation
  faq_kicker: Questions
  faq_title: What shops ask first
  faq:
    - q: Can our competitors see our prices?
      a: "Yes, just as they can today by sending a drawing for a quote. The calculator makes that quicker, and in return customers who would not wait until evening get a price from you at once. You still decide the final price."
    - q: What happens with bent parts?
      a: "The calculator does not price bending. If a bend line is on its own layer or shows up as an open line, the drawing reaches you as a custom quote request. It cannot detect bends drawn any other way, which is why nothing binds the customer until you approve."
    - q: Where do the drawings go?
      a: "The system uses a drawing only to calculate the price and does not store it. With a quote request, it forwards the drawing to you as an e-mail attachment."
    - q: How accurate is the price?
      a: "We checked the geometry on 14 reference drawings, but the price is only reliable once tuned to your jobs. That is why it is an indicative price that you approve."
    - q: What if the customer has no DXF?
      a: "They can send a PDF, STEP or photo instead. They get no instant price, and you receive the request with the file as usual."
  close_title: Want to see it with your own rates?
  close_text: "Write to us and we will set up a trial page with your shop's materials and rates."
  privacy: Privacy
  foot_note: This page uses no cookies and no tracking.

# Site settings. Personal details (name, email, links) live in _data/profile.yml.
title: SSY Dynamics
description: SSY Dynamics builds precise, deterministic engineering tools, from APIs for finance and manufacturing data to mechatronics and research.
lang: en

# Custom domain: also in the CNAME file and GitHub Pages settings (see README.md).
url: https://ssydynamics.dev
baseurl: ""

# Live demo services (Cloud Run, DEMO_MODE=1). Empty = no "Your file" tab and no JavaScript on the page.
# For local testing, override these in _config.local.yml (see README.md).
demo_api:
  reconciler: https://reconciler-demo-258730673938.europe-west1.run.app
  dxf: https://dxf-demo-258730673938.europe-west1.run.app
  sepa: https://sepa-demo-258730673938.europe-west1.run.app

# Free runs per visitor per day in the live demos (must match DEMO_PER_CLIENT_PER_DAY on the demo services).
demo_runs_per_day: 5

# Paddle checkout on /pricing/. Sandbox until the live account is verified: then set environment: production,
# the live_ token, and the live price ids in _data/pricing.yml. Paddle.js loads only when a Buy button is clicked.
paddle:
  environment: sandbox
  client_token: test_9d567618223e908df428a25295c

# Feedback collector (Cloud Run). Empty = no report buttons and no contact form (the e-mail line stays).
feedback_api: https://feedback-collector-258730673938.europe-west1.run.app

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-sitemap

# Content types. Each one is a folder of Markdown files; adding a file adds a page.
collections:
  products:
    output: true
    permalink: /products/:name/
  privacy:
    output: true
    permalink: /products/:name/privacy/
  projects:                   # mechatronics builds and other engineering projects
    output: true
    permalink: /projects/:name/
  research:                   # papers, experiments, measurements
    output: true
    permalink: /research/:name/
  product_categories:
    output: true
    permalink: /categories/:name/
  landing:                    # keyword pages ("MT940 to CSV" ...), one file each in _landing/
    output: true
    permalink: /tools/:name/

defaults:
  - scope: { path: "" }
    values: { layout: page }
  - scope: { path: "", type: products }
    values: { layout: product }
  - scope: { path: "", type: privacy }
    values: { layout: legal }
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "", type: research }
    values: { layout: project }
  - scope: { path: "", type: product_categories }
    values: { layout: category }
  - scope: { path: "", type: landing }
    values: { layout: tool }

exclude:
  - README.md
  - _templates/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - _config.local.yml
  - docs/

---
layout: default
---
<article class="wrap page">
  <header class="page-head">
    {%- if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lede %}<p class="lede">{{ page.lede }}</p>{% endif %}
  </header>
  <div class="prose">
{{ content }}
  </div>
</article>

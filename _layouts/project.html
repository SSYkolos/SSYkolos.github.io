---
layout: default
---
<article class="wrap page">
  <header class="page-head">
    <p class="eyebrow"><a href="{{ '/projects/' | relative_url }}">Projects</a>{% if page.year %} / {{ page.year }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {%- if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
    {%- if page.stack %}<p class="io">{{ page.stack | join: " · " }}</p>{% endif %}
  </header>
  <div class="prose">
{{ content }}
  </div>
</article>

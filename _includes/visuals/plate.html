{%- comment -%}
  Worked example, calculated by hand (not API output):
  120 x 80 mm plate, four Ø8 holes. Cut = 2*(120+80) + 4*π*8 = 500.53 mm.
  Net area = 9600 - 4*π*4² = 9398.94 mm². Pierces = 1 outline + 4 holes = 5.
{%- endcomment -%}
<figure class="readout readout--drawing">
  <figcaption class="readout__head">
    <span>Worked example</span>
    <span class="readout__tag">hand-calculated</span>
  </figcaption>
  <svg class="drawing" viewBox="0 0 170 128" role="img" aria-labelledby="plate-desc">
    <desc id="plate-desc">A 120 by 80 millimetre plate with four 8 millimetre holes near the corners. Five pierce points are numbered.</desc>
    <g class="drawing__dim">
      <line x1="25" y1="10" x2="145" y2="10"/><line x1="25" y1="6" x2="25" y2="14"/><line x1="145" y1="6" x2="145" y2="14"/>
      <text x="85" y="7.5" text-anchor="middle">120</text>
      <line x1="156" y1="20" x2="156" y2="100"/><line x1="152" y1="20" x2="160" y2="20"/><line x1="152" y1="100" x2="160" y2="100"/>
      <text x="163" y="62" text-anchor="middle" transform="rotate(90 163 62)">80</text>
    </g>
    <g class="drawing__cut">
      <rect x="25" y="20" width="120" height="80"/>
      <circle cx="37" cy="32" r="4"/><circle cx="133" cy="32" r="4"/>
      <circle cx="37" cy="88" r="4"/><circle cx="133" cy="88" r="4"/>
    </g>
    <g class="drawing__pierce">
      <circle cx="25" cy="20" r="1.6"/><text x="20" y="17">1</text>
      <circle cx="41" cy="32" r="1.6"/><text x="44" y="28">2</text>
      <circle cx="137" cy="32" r="1.6"/><text x="140" y="28">3</text>
      <circle cx="41" cy="88" r="1.6"/><text x="44" y="84">4</text>
      <circle cx="137" cy="88" r="1.6"/><text x="140" y="84">5</text>
    </g>
    <text class="drawing__note" x="85" y="62" text-anchor="middle">4 × Ø8</text>
  </svg>
  <dl class="readout__rows">
    <div><dt>Cut length</dt><dd>500.53 mm</dd></div>
    <div><dt>Pierces</dt><dd>5</dd></div>
    <div><dt>Parts / holes</dt><dd>1 / 4</dd></div>
    <div><dt>Net area</dt><dd>9,398.94 mm²</dd></div>
  </dl>
</figure>

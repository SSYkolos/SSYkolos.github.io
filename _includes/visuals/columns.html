{%- comment -%} The CSV columns, as defined in the extension's leads.js (CSV_COLUMNS). {%- endcomment -%}
<figure class="readout">
  <figcaption class="readout__head">
    <span>Export columns</span>
    <span class="readout__tag">CSV · 40 fields</span>
  </figcaption>
  <div class="cols">
    <p class="cols__group"><span class="cols__label">Business</span> Name · Category · All categories · Description · Rating · Reviews · Price level · Google type · Sponsored</p>
    <p class="cols__group"><span class="cols__label">Contact</span> Phone · Phone (international) · Website · Domain · <b>Email</b> · <b>All emails</b></p>
    <p class="cols__group"><span class="cols__label">Social</span> <b>LinkedIn</b> · <b>Facebook</b> · <b>Instagram</b> · <b>X / Twitter</b> · <b>YouTube</b> · <b>TikTok</b></p>
    <p class="cols__group"><span class="cols__label">Location</span> Address · Street · Postal code · City · District · Country · Latitude · Longitude · Time zone · Plus code</p>
    <p class="cols__group"><span class="cols__label">Hours</span> Opening hours · Opening status</p>
    <p class="cols__group"><span class="cols__label">Reference</span> Place ID · CID · Google Maps URL · Data source · Search · First seen · Email search</p>
  </div>
  <p class="readout__foot"><b>Highlighted</b> fields come from the businesses' own websites.</p>
</figure>

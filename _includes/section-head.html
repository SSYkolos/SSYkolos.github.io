{%- comment -%} include section-head.html num="01" title="..." id="..." intro="..." {%- endcomment -%}
<header class="sec-head">
  {%- assign num = include.num | plus: 0 %}
  <p class="sec-head__num" aria-hidden="true">{% if num < 10 %}0{% endif %}{{ num }}</p>
  <h2 class="sec-head__title"{% if include.id %} id="{{ include.id }}-title"{% endif %}>{{ include.title }}</h2>
  {%- if include.intro %}
  <p class="sec-head__intro">{{ include.intro }}</p>
  {%- endif %}
</header>

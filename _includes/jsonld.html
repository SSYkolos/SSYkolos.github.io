{%- comment -%}
  Structured data for search engines (JSON-LD; data only, never executed, so the CSP does not apply).
  include jsonld.html type="product|tool" product=<product document>
{%- endcomment -%}
{%- assign prod = include.product -%}
{%- assign crumbs_url = "/products/" -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {% if include.type == "tool" -%}
        {"@type": "ListItem", "position": 1, "name": "Tools", "item": {{ '/tools/' | absolute_url | jsonify }}},
        {"@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
        {%- else -%}
        {"@type": "ListItem", "position": 1, "name": "Products", "item": {{ '/products/' | absolute_url | jsonify }}},
        {"@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
        {%- endif %}
      ]
    }
    {%- if include.type == "product" %},
    {
      "@type": "SoftwareApplication",
      "name": {{ prod.title | jsonify }},
      "description": {{ prod.description | default: prod.summary | jsonify }},
      "url": {{ prod.url | absolute_url | jsonify }},
      "applicationCategory": "BusinessApplication",
      "operatingSystem": {% if prod.kind contains "Chrome" %}"Chrome"{% else %}"Web"{% endif %},
      "author": {"@type": "Person", "name": {{ site.data.profile.name | jsonify }}, "url": {{ '/' | absolute_url | jsonify }}}
    }
    {%- endif %}
    {%- if include.type == "tool" and page.faq %},
    {
      "@type": "FAQPage",
      "mainEntity": [
        {%- for f in page.faq %}
        {"@type": "Question", "name": {{ f.q | jsonify }}, "acceptedAnswer": {"@type": "Answer", "text": {{ f.a | markdownify | strip_html | strip | jsonify }}}}{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
    {%- endif %}
  ]
}
</script>

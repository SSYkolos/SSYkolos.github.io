{%- assign profile = site.data.profile -%}
<footer class="site-foot">
  <div class="wrap site-foot__inner">
    <div class="site-foot__id">
      <span class="mark mark--small" aria-hidden="true">KH</span>
      <span>&copy; {{ site.time | date: "%Y" }} {{ profile.name }} · {{ profile.location }}</span>
    </div>
    <ul class="site-foot__links">
      <li>{% include email.html %}</li>
      {%- for link in profile.links %}
      <li><a href="{{ link.url }}" rel="me">{{ link.name }}</a></li>
      {%- endfor %}
      <li><a href="{{ '/privacy/' | relative_url }}">Privacy</a></li>
    </ul>
    <p class="site-foot__note">No cookies · no trackers · no JavaScript</p>
  </div>
</footer>

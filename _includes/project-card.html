{%- assign p = include.project -%}
<article class="card">
  <div class="card__meta">
    <span class="kind">{{ p.kind | default: "Project" }}</span>
    {%- if p.year %}<span class="status status--plain">{{ p.year }}</span>{% endif %}
  </div>
  <h3 class="card__title"><a class="stretch" href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
  {%- if p.stack %}
  <p class="io">{{ p.stack | join: " · " }}</p>
  {%- endif %}
  <p class="card__text">{{ p.summary }}</p>
  <span class="card__go" aria-hidden="true">Read →</span>
</article>
